[workspace]
resolver = "2"
members = [
    "crates/shoestring-ipc",
    "crates/shoestring-config",
    "crates/shoestring-bar",
    "crates/shoestring-confirm",
    "crates/shoestring-ctl",
    "crates/shoestring-kill",
    "crates/shoestring-lock",
    "crates/shoestring-menu",
    "crates/shoestring-notify",
    "crates/shoestring-region",
    "crates/shoestring-screenshot",
]
# `wlcs-shoestring` is a cdylib WLCS test plugin that pulls a second smithay
# instantiation (renderer_test feature) — expensive and never wanted by a plain
# `cargo build`, `cargo test`, or the `--workspace` clippy/release jobs. Exclude
# it from the workspace so only the dedicated WLCS CI job builds it, via
# `cargo build --manifest-path crates/wlcs-shoestring/Cargo.toml`. It still
# path-depends back on the workspace crates; cargo gives it its own lockfile.
exclude = ["crates/wlcs-shoestring"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/barrendo/shoestring-wm"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[package]
name = "shoestring-wm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A lightweight Rust Wayland window manager."

[lib]
name = "shoestring_wm"
path = "src/lib.rs"

[[bin]]
name = "shoestring-wm"
path = "src/main.rs"

[features]
default = ["winit", "tty"]
# Marker that a real GLES renderer is compiled in. Both real backends pull
# `smithay/renderer_gl` already (winit transitively via backend_winit, tty
# explicitly); this exposed feature lets a backend-less consumer — the WLCS
# headless harness, which renders with smithay's DummyRenderer — still request
# the `gles` module so GL-only code (the screencopy capture helper) compiles.
gl = ["smithay/renderer_gl"]
winit = ["smithay/backend_winit"]
tty = [
    "smithay/backend_libinput",
    "smithay/backend_udev",
    "smithay/backend_drm",
    "smithay/backend_gbm",
    "smithay/backend_egl",
    "smithay/backend_session_libseat",
    "smithay/renderer_gl",
    "smithay/renderer_multi",
    "dep:smithay-drm-extras",
]

[dependencies]
shoestring-ipc = { path = "crates/shoestring-ipc" }
shoestring-config = { path = "crates/shoestring-config" }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
bitflags = "2"
thiserror = "2"
xcursor = "0.3"
notify = "8"
regex = "1"
libc = "0.2"

[dependencies.smithay]
git = "https://github.com/Smithay/smithay.git"
rev = "95a8e45004f519f62f3490f2602c4082a7af9bf8"
default-features = false
features = [
    "wayland_frontend",
    "desktop",
    "xwayland",
]

[dependencies.smithay-drm-extras]
git = "https://github.com/Smithay/smithay.git"
rev = "95a8e45004f519f62f3490f2602c4082a7af9bf8"
optional = true

# --- Debian/Ubuntu packaging (cargo-deb) ---------------------------------
# Builds a single `.deb` that bundles the WM plus every helper binary, the
# Wayland session file (so the compositor shows up in the GDM/SDDM/LightDM
# login menu), the session wrapper, and the man pages.
#
# The release workflow runs `cargo build --workspace --release` and
# `make -C docs man` FIRST, then `cargo deb --no-build` — so the asset
# sources below already exist by the time the package is assembled.
# To build it locally:
#   make -C docs man && cargo build --workspace --release && cargo deb --no-build
#
# `depends` defaults to "$auto": cargo-deb runs dpkg-shlibdeps over the
# binaries and pins the exact runtime libs (libwayland, libxkbcommon,
# libdrm, libgbm, libegl, libinput, libseat, libdisplay-info, libpam),
# so we don't hand-maintain that list.
[package.metadata.deb]
maintainer = "Brandon Arrendondo <barrendo@gmail.com>"
section = "x11"
priority = "optional"
# "$auto" keeps cargo-deb's dpkg-shlibdeps autodetection for the shared
# libraries; libpam-modules is added explicitly because shoestring-lock
# authenticates the unlock via PAM's setuid unix_chkpwd helper, which
# lives in that package (present by default on desktops, but not on
# minimal installs).
depends = "$auto, libpam-modules"
# xwayland is optional — only needed to run X11 apps (GIMP, Inkscape, etc.)
recommends = "xwayland"
extended-description = """\
A lightweight Rust Wayland window manager built on Smithay, shipped with \
its companion tools: a status bar, dmenu-style launcher, notification \
daemon, screen locker, screenshot/region pickers, and an IPC control \
client. Pick "shoestring-wm" from your display manager's session menu."""
assets = [
    ["target/release/shoestring-wm",         "usr/bin/", "755"],
    ["target/release/shoestring-bar",        "usr/bin/", "755"],
    ["target/release/shoestring-ctl",        "usr/bin/", "755"],
    ["target/release/shoestring-kill",       "usr/bin/", "755"],
    ["target/release/shoestring-notify",     "usr/bin/", "755"],
    ["target/release/shoestring-lock",       "usr/bin/", "755"],
    ["target/release/shoestring-screenshot", "usr/bin/", "755"],
    ["target/release/shoestring-confirm",    "usr/bin/", "755"],
    ["target/release/shoestring-menu",       "usr/bin/", "755"],
    ["target/release/shoestring-region",     "usr/bin/", "755"],
    ["resources/shoestring-wm-session",      "usr/bin/", "755"],
    ["resources/shoestring-wm.desktop",      "usr/share/wayland-sessions/", "644"],
    ["docs/_build/man/shoestring-wm.1",      "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-wm.5",      "usr/share/man/man5/", "644"],
    ["docs/_build/man/shoestring-bar.1",     "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-menu.1",    "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-ctl.1",     "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-confirm.1",    "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-kill.1",       "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-lock.1",       "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-notify.1",     "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-region.1",     "usr/share/man/man1/", "644"],
    ["docs/_build/man/shoestring-screenshot.1", "usr/share/man/man1/", "644"],
    ["README.md",                            "usr/share/doc/shoestring-wm/README.md", "644"],
    ["LICENSE",                              "usr/share/doc/shoestring-wm/", "644"],
]

# --- Fedora/RHEL packaging (cargo-generate-rpm) --------------------------
# The RPM analogue of the cargo-deb block above. The release workflow
# builds this inside a Fedora container (NOT the Ubuntu runner) so the
# auto-detected `Requires` reference Fedora's library packages, not
# Ubuntu's sonames. Same prerequisites as the deb: build the workspace
# and the man pages first, then `cargo generate-rpm`.
#
# auto_req = "auto" (the default) runs rpm's find-requires over the
# binaries to pin the shared libs (wayland, libxkbcommon, libdrm,
# mesa-libgbm, mesa-libEGL, libinput, libseat, libdisplay-info, pam).
# `pam` is also required explicitly — shoestring-lock authenticates via
# PAM's setuid unix_chkpwd helper, which Fedora ships in the `pam`
# package.
[package.metadata.generate-rpm]
summary = "A lightweight Rust Wayland window manager"
assets = [
    { source = "target/release/shoestring-wm",         dest = "/usr/bin/shoestring-wm",         mode = "0755" },
    { source = "target/release/shoestring-bar",        dest = "/usr/bin/shoestring-bar",        mode = "0755" },
    { source = "target/release/shoestring-ctl",        dest = "/usr/bin/shoestring-ctl",        mode = "0755" },
    { source = "target/release/shoestring-kill",       dest = "/usr/bin/shoestring-kill",       mode = "0755" },
    { source = "target/release/shoestring-notify",     dest = "/usr/bin/shoestring-notify",     mode = "0755" },
    { source = "target/release/shoestring-lock",       dest = "/usr/bin/shoestring-lock",       mode = "0755" },
    { source = "target/release/shoestring-screenshot", dest = "/usr/bin/shoestring-screenshot", mode = "0755" },
    { source = "target/release/shoestring-confirm",    dest = "/usr/bin/shoestring-confirm",    mode = "0755" },
    { source = "target/release/shoestring-menu",       dest = "/usr/bin/shoestring-menu",       mode = "0755" },
    { source = "target/release/shoestring-region",     dest = "/usr/bin/shoestring-region",     mode = "0755" },
    { source = "resources/shoestring-wm-session",      dest = "/usr/bin/shoestring-wm-session", mode = "0755" },
    { source = "resources/shoestring-wm.desktop",      dest = "/usr/share/wayland-sessions/shoestring-wm.desktop", mode = "0644" },
    { source = "docs/_build/man/shoestring-wm.1",      dest = "/usr/share/man/man1/shoestring-wm.1",   mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-wm.5",      dest = "/usr/share/man/man5/shoestring-wm.5",   mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-bar.1",     dest = "/usr/share/man/man1/shoestring-bar.1",  mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-menu.1",    dest = "/usr/share/man/man1/shoestring-menu.1", mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-ctl.1",     dest = "/usr/share/man/man1/shoestring-ctl.1",  mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-confirm.1",    dest = "/usr/share/man/man1/shoestring-confirm.1",    mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-kill.1",       dest = "/usr/share/man/man1/shoestring-kill.1",       mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-lock.1",       dest = "/usr/share/man/man1/shoestring-lock.1",       mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-notify.1",     dest = "/usr/share/man/man1/shoestring-notify.1",     mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-region.1",     dest = "/usr/share/man/man1/shoestring-region.1",     mode = "0644", doc = true },
    { source = "docs/_build/man/shoestring-screenshot.1", dest = "/usr/share/man/man1/shoestring-screenshot.1", mode = "0644", doc = true },
    { source = "README.md",                            dest = "/usr/share/doc/shoestring-wm/README.md", mode = "0644", doc = true },
    { source = "LICENSE",                              dest = "/usr/share/licenses/shoestring-wm/LICENSE", mode = "0644", doc = true },
]

[package.metadata.generate-rpm.requires]
pam = "*"

[dev-dependencies]
# Used by tests/output_management.rs: speak the wlr-output-management
# protocol as a Wayland client without requiring wlr-randr / kanshi installed.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client", "wayland-client"] }
# Used by tests/pointer_constraints.rs: speak zwp_pointer_constraints_v1 +
# zwp_relative_pointer_v1 as a client. Both live behind the `unstable` feature.
wayland-protocols = { version = "0.32", features = ["client", "unstable", "wayland-client"] }
