# Pre-commit hooks for shoestring-wm
# Install: pre-commit install
# Run manually: pre-commit run --all-files

default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (auto-fix)
        description: Format Rust code with rustfmt
        entry: bash -c 'cargo fmt --all 2>&1 && echo "Formatting complete"'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

      - id: cargo-clippy
        name: cargo clippy
        description: Lint Rust code with Clippy - deny warnings (all targets including tests)
        entry: bash -c 'cargo clippy --all-targets --all-features -- -D warnings 2>&1'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

      - id: cargo-test
        name: cargo test
        description: Run the test suite
        entry: bash -c 'cargo test --workspace 2>&1'
        language: system
        pass_filenames: false
        types: [rust]
        verbose: true

  # Python tooling (tasks.py and friends). Pinned rev = reproducible;
  # pre-commit builds ruff its own isolated env, so this works without the
  # docs/dev virtualenv active. Bump with `pre-commit autoupdate`.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.11
    hooks:
      # The commit-policy guards under scripts/ are kept byte-identical
      # with the maintainer's other repositories, so ruff leaves them alone.
      - id: ruff-check    # lint (auto-fix what it safely can)
        args: [--fix]
        exclude: &policy-guards ^scripts/(check_|test_check_).*\.py$
      - id: ruff-format   # format, the Python counterpart to cargo fmt
        exclude: *policy-guards

  # knots complexity gate, from the prebuilt-wheel mirror. The default `knots`
  # hook ships args [--aird-threshold=85] (checked in the mirror's
  # .pre-commit-hooks.yaml), so no override is needed here. To tighten or add
  # metrics, set `args:` (pre-commit replaces them wholesale), e.g.
  #   args: [--aird-threshold=85, --cognitive-threshold=20]
  - repo: https://github.com/brandon-arrendondo/knots-pre-commit
    rev: v1.19.0
    hooks:
      - id: knots
        types_or: [rust, python]
        # third_party/ is vendored upstream code. Refactoring it to our
        # metric would only make it harder to diff against upstream.
        exclude: ^third_party/

  # Commit policy (see AGENTS.md): DCO sign-off required, AI attribution
  # trailers rejected. The guard tests cover this check and the Codex
  # PreToolUse guard in scripts/check_agent_command.py.
  - repo: local
    hooks:
      - id: commit-message-policy
        name: DCO sign-off and no AI attribution trailers
        entry: python3 scripts/check_commit_message.py
        language: system
        stages: [commit-msg]
      - id: agent-guard-tests
        name: agent and commit guard regression tests
        entry: python3 -W error::ResourceWarning -m unittest discover -s scripts -p test_check_*.py
        language: system
        pass_filenames: false
        files: ^scripts/(check_|test_check_).*\.py$
