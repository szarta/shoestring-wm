name: CI

# Same checks the local pre-commit hook runs (fmt + clippy + test),
# plus a release build to catch anything that only breaks under -O.
# Runs on every push to main and on every pull request.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # System deps mirror the Debian/Ubuntu list in docs/install.rst.
      # libseat-dev + libdisplay-info-dev land in 24.04; older runners
      # would need an explicit PPA. libpipewire-0.3-dev (ships the libspa-0.2
      # headers too) + libclang-dev are what the screencast portal's
      # pipewire-sys/libspa-sys bindgen build needs.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev libpixman-1-dev \
            libpam0g-dev \
            libpipewire-0.3-dev libclang-dev

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/{registry,git} + target/. Keyed on Cargo.lock,
      # so dep churn invalidates cleanly.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build (release)
        run: cargo build --workspace --release

      # License gate: cargo-about refuses any shipped dependency whose license
      # isn't in about.toml's accepted list, so a new license is reviewed on
      # the commit that brings it in, not at release time.
      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.2 --features cli --locked

      - name: Check dependency licenses
        run: cargo about generate about.hbs -o /dev/null

  # The default build is `winit + tty + headless`; `cargo build --workspace`
  # above only ever exercises that combo. This matrix compiles shoestring-wm with each
  # non-default backend feature set on its own so they don't silently rot —
  # e.g. a function gated `#[cfg(feature = "tty")]` but called from the winit
  # backend compiles fine by default yet breaks the winit-only build.
  #
  # Combos:
  #   - winit / tty / headless: each real backend, built in isolation.
  #   - gl: backend-less, renderer only — the shape the WLCS headless harness
  #     consumes. (A pure `--no-default-features` build does NOT compile by
  #     design: the screencopy capture path needs `renderer_gl`, which is
  #     exactly what the `gl` marker feature pulls in for backend-less users.)
  #
  # Plain `cargo build`, not `clippy -D warnings`: the backend-less config
  # legitimately leaves a lot of backend plumbing as dead code, so the goal
  # here is compile-rot detection, not a warning gate.
  # Minimum supported Rust version: check the workspace (all targets, all
  # features) with the toolchain named by `rust-version` in Cargo.toml, so a
  # change that needs a newer compiler or bumps a dependency past it fails
  # here instead of on a distribution's older rustc. Keep the version below in
  # step with Cargo.toml.
  msrv:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev libpixman-1-dev \
            libpam0g-dev \
            libpipewire-0.3-dev libclang-dev

      - name: Toolchain (MSRV)
        uses: dtolnay/rust-toolchain@1.88.0

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: cargo check (MSRV)
        run: cargo check --workspace --all-targets --all-features --locked

  feature-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend-less (gl only), features: gl }
          - { name: winit only, features: winit }
          - { name: tty only, features: tty }
          - { name: headless only, features: headless }
    name: build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v5

      # Superset of every backend's build deps (same list as `check`, minus the
      # PipeWire/clang headers, which only the portal/mediad crates need — this
      # job builds the WM crate alone).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev libpixman-1-dev

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: cargo build (${{ matrix.features }})
        run: cargo build -p shoestring-wm --no-default-features --features ${{ matrix.features }}

  # Runs the WM's #[ignore]'d integration tests against a real, headless
  # shoestring-wm instance. The protocol suites (output-management,
  # pointer-constraints/gestures, tablet, idle-inhibit, virtual-pointer,
  # foreign-toplevel-management) connect to a live compositor over
  # $WAYLAND_DISPLAY, so the plain `cargo test` above only compiles them. Here
  # the winit backend runs nested in Xvfb with Mesa's llvmpipe software
  # renderer — no GPU needed. See scripts/headless-integration-tests.sh.
  integration:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # Same build deps as `check`, plus Xvfb (the X server the winit backend
      # nests in) and the Mesa DRI drivers (llvmpipe, for software EGL/GLES).
      # libxkbcommon-x11-0 is dlopen'd by winit's X11 backend for keymap setup;
      # without it the nested WM exits before opening its Wayland socket.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev libpixman-1-dev \
            libpam0g-dev \
            libpipewire-0.3-dev libclang-dev \
            xvfb libgl1-mesa-dri

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Integration tests (headless WM)
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/headless-integration-tests.sh

  # End-to-end tests for the native headless backend and remote sessions: each
  # test starts `shoestring-wm --backend headless` on Mesa's software renderer,
  # maps a test client, drives it with injected input and checks pixels, then
  # runs the real shoestring-remote-server and checks what a viewer sees (gate
  # revocation, reconnect, the session lock, graft of hidden windows). No X
  # server needed. See scripts/headless-e2e-tests.sh.
  e2e:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      # Same build deps as `check`, plus Mesa's surfaceless EGL and the DRI
      # drivers (llvmpipe), which the headless backend renders with.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev libpixman-1-dev \
            libpam0g-dev \
            libpipewire-0.3-dev libclang-dev \
            libegl-mesa0 libgl1-mesa-dri

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: End-to-end tests (headless backend + remote)
        run: scripts/headless-e2e-tests.sh

  # The same fmt/clippy/test/build sequence on FreeBSD, inside a VM action
  # (GitHub has no native FreeBSD runner). Catches OpenPAM/libudev-devd
  # portability regressions — notably shoestring-lock's PAM module
  # (crates/shoestring-lock/src/pam.rs), whose conversation tests run here
  # against OpenPAM's return codes. Deps mirror the FreeBSD list in
  # docs/install.rst.
  #
  # Every crate builds here, the two PipeWire-linked ones included:
  # FreeBSD's pipewire package renames pw_init/pw_deinit, and the patched
  # third_party/pipewire-sys (ADR 0002) binds the new names. The port build
  # itself is checked by hand on a FreeBSD machine (make stage && make
  # check-plist), not by this gate.
  check-freebsd:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5

      - name: Build + test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          usesh: true
          # git: cargo fetches smithay from a git revision, so the VM needs it.
          # rust pkg bundles cargo + rustfmt + clippy. No drm-kmod: building
          # only needs the userland libs/headers, not the kernel module.
          prepare: |
            pkg install -y \
              git rust pkgconf \
              wayland libxkbcommon \
              libdrm mesa-libs \
              libudev-devd libinput \
              seatd libdisplay-info pixman pipewire
          # pkg installs libs under /usr/local/lib, which base ld(1) does not
          # search — point the linker at it (matches docs/install.rst).
          run: |
            set -e
            export RUSTFLAGS="-L/usr/local/lib"
            export CARGO_TERM_COLOR=always
            cargo fmt --all -- --check
            cargo clippy --workspace --all-targets -- -D warnings
            cargo test --workspace
            cargo build --workspace --release
