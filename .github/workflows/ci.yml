name: CI

# Same checks the local pre-commit hook runs (fmt + clippy + test),
# plus a release build to catch anything that only breaks under -O.
# Runs on every push to main and on every pull request.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # System deps mirror the Debian/Ubuntu list in docs/install.rst.
      # libseat-dev + libdisplay-info-dev land in 24.04; older runners
      # would need an explicit PPA. libpipewire-0.3-dev (ships the libspa-0.2
      # headers too) + libclang-dev are what the screencast portal's
      # pipewire-sys/libspa-sys bindgen build needs.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev \
            libpam0g-dev \
            libpipewire-0.3-dev libclang-dev

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Caches ~/.cargo/{registry,git} + target/. Keyed on Cargo.lock,
      # so dep churn invalidates cleanly.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo build (release)
        run: cargo build --workspace --release

  # The default build is `winit + tty`; `cargo build --workspace` above only
  # ever exercises that combo. This matrix compiles shoestring-wm with each
  # non-default backend feature set on its own so they don't silently rot —
  # e.g. a function gated `#[cfg(feature = "tty")]` but called from the winit
  # backend compiles fine by default yet breaks the winit-only build.
  #
  # Combos:
  #   - winit / tty: each real backend, built in isolation.
  #   - gl: backend-less, renderer only — the shape the WLCS headless harness
  #     consumes. (A pure `--no-default-features` build does NOT compile by
  #     design: the screencopy capture path needs `renderer_gl`, which is
  #     exactly what the `gl` marker feature pulls in for backend-less users.)
  #
  # Plain `cargo build`, not `clippy -D warnings`: the backend-less config
  # legitimately leaves a lot of backend plumbing as dead code, so the goal
  # here is compile-rot detection, not a warning gate.
  feature-matrix:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: backend-less (gl only), features: gl }
          - { name: winit only, features: winit }
          - { name: tty only, features: tty }
    name: build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v4

      # Superset of every backend's build deps (same list as `check`, minus the
      # PipeWire/clang headers, which only the portal/mediad crates need — this
      # job builds the WM crate alone).
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: cargo build (${{ matrix.features }})
        run: cargo build -p shoestring-wm --no-default-features --features ${{ matrix.features }}

  # Runs the WM's #[ignore]'d integration tests against a real, headless
  # shoestring-wm instance. The protocol suites (output-management,
  # pointer-constraints/gestures, tablet, idle-inhibit, virtual-pointer,
  # foreign-toplevel-management) connect to a live compositor over
  # $WAYLAND_DISPLAY, so the plain `cargo test` above only compiles them. Here
  # the winit backend runs nested in Xvfb with Mesa's llvmpipe software
  # renderer — no GPU needed. See scripts/headless-integration-tests.sh.
  integration:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # Same build deps as `check`, plus Xvfb (the X server the winit backend
      # nests in) and the Mesa DRI drivers (llvmpipe, for software EGL/GLES).
      # libxkbcommon-x11-0 is dlopen'd by winit's X11 backend for keymap setup;
      # without it the nested WM exits before opening its Wayland socket.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libdrm-dev libgbm-dev libegl-dev \
            libudev-dev libinput-dev \
            libseat-dev libdisplay-info-dev \
            libpam0g-dev \
            libpipewire-0.3-dev libclang-dev \
            xvfb libgl1-mesa-dri

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2

      - name: Integration tests (headless WM)
        run: xvfb-run -a -s "-screen 0 1280x800x24" scripts/headless-integration-tests.sh

  # The same fmt/clippy/test/build sequence on FreeBSD, inside a VM action
  # (GitHub has no native FreeBSD runner). Catches OpenPAM/libudev-devd
  # portability regressions — notably the vendored pam-client2 fork that
  # lets shoestring-lock build there (third_party/pam-client2). Deps mirror
  # the FreeBSD list in docs/install.rst.
  #
  # The two PipeWire-linked crates (xdg-desktop-portal-shoestring and
  # shoestring-mediad) are EXCLUDED here: on FreeBSD they're the optional
  # SCREENCAST component of the port (packaging/freebsd gates them behind a port
  # option, not built by default), and FreeBSD isn't on the screen-sharing /
  # media-privacy critical path. Their pipewire-sys/libspa-sys bindgen also
  # doesn't resolve cleanly in this bare VM (the pipewire crate can't see
  # pw_init). The real FreeBSD build of both is validated by the port via
  # poudriere + manual checks on dev-106, not this gate. Everything else (WM tty
  # backend + every other helper) compiles, so nothing else is feature-gated out.
  check-freebsd:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Build + test on FreeBSD
        uses: vmactions/freebsd-vm@v1
        with:
          release: "15.0"
          usesh: true
          # git: cargo fetches smithay from a git revision, so the VM needs it.
          # rust pkg bundles cargo + rustfmt + clippy. No drm-kmod: building
          # only needs the userland libs/headers, not the kernel module.
          prepare: |
            pkg install -y \
              git rust pkgconf \
              wayland libxkbcommon \
              libdrm mesa-libs \
              libudev-devd libinput \
              seatd libdisplay-info
          # pkg installs libs under /usr/local/lib, which base ld(1) does not
          # search — point the linker at it (matches docs/install.rst).
          # --exclude the screencast portal (see the comment on this job):
          # it's the port's optional SCREENCAST component, built elsewhere.
          run: |
            set -e
            export RUSTFLAGS="-L/usr/local/lib"
            export CARGO_TERM_COLOR=always
            EXCLUDE="--exclude xdg-desktop-portal-shoestring --exclude shoestring-mediad"
            cargo fmt --all -- --check
            cargo clippy --workspace $EXCLUDE --all-targets -- -D warnings
            cargo test --workspace $EXCLUDE
            cargo build --workspace $EXCLUDE --release
