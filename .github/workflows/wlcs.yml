name: WLCS

# Wayland Conformance Test Suite. Builds the cdylib WLCS plugin
# (crates/wlcs-shoestring, excluded from the workspace) and runs the full suite
# against it, gating on the tracked xfail skip-list (tests/wlcs/run-wlcs.sh).
#
# BLOCKING push/PR gate. The skip-list is seeded (2026-06-19: 433/1225 pass, 792
# anvil-verified xfails, 0 our-side bugs) and the harness gives a deterministic
# verdict under load as of task 161. The "load-dependent flaky band" that kept
# this manual-only turned out NOT to be frame-pacing but a teardown crash: WLCS
# dlopen()s the plugin and dlclose()s it at process exit, and under load a
# just-spawned compositor thread could still be in its TLS-setup trampoline when
# the loader unmapped our segments -> SIGSEGV during exit, AFTER the test had
# already passed, which the runner scored (by exit code) as a spurious FAIL. The
# plugin now pins itself RTLD_NODELETE (crates/wlcs-shoestring/src/lib.rs), so
# the suite is stable across repeats and many-way parallelism (verified on an
# 8-core node: 3x full parallel runs == serial baseline, 0 churn). A red run now
# means a real conformance regression (or a newly-passing skip-list entry to
# remove).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Pin WLCS: it adds tests over time, and the xfail skip-list is only stable
  # against a fixed suite. Bump deliberately (and re-seed) rather than tracking
  # a moving branch.
  WLCS_REF: v1.8.1

jobs:
  wlcs:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      # WLCS build-deps (from its debian/control) plus a Rust toolchain for the
      # plugin. libwayland-dev is for the C++ suite; the plugin itself dlopens
      # libwayland at runtime and needs no -dev package.
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            libwayland-dev libboost-dev \
            libgtest-dev libgmock-dev \
            python3

      - name: Build & install WLCS ${{ env.WLCS_REF }}
        run: |
          git clone --depth 1 --branch "$WLCS_REF" \
            https://github.com/canonical/wlcs.git /tmp/wlcs
          cmake -S /tmp/wlcs -B /tmp/wlcs/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/wlcs/build -j"$(nproc)"
          sudo cmake --install /tmp/wlcs/build

      - name: Toolchain
        uses: dtolnay/rust-toolchain@stable

      # The plugin is its own (excluded) cargo workspace, so cache it under its
      # manifest dir.
      - name: Cache cargo + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/wlcs-shoestring

      - name: Build WLCS plugin
        run: cargo build --release --manifest-path crates/wlcs-shoestring/Cargo.toml

      - name: Run WLCS (xfail-gated)
        run: tests/wlcs/run-wlcs.sh crates/wlcs-shoestring/target/release/libwlcs_shoestring.so
