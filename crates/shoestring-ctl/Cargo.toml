[package]
name = "shoestring-ctl"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Reference CLI client for the shoestring-wm IPC socket."

[[bin]]
name = "shoestring-ctl"
path = "src/main.rs"

[dependencies]
shoestring-ipc = { path = "../shoestring-ipc" }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
