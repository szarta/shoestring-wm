[package]
name = "xdg-desktop-portal-shoestring"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Native xdg-desktop-portal ScreenCast backend for shoestring-wm: per-consumer dmabuf+shm PipeWire screencast over zwlr_screencopy_v1."
repository = "https://github.com/barrendo/shoestring-wm"

[[bin]]
name = "xdg-desktop-portal-shoestring"
path = "src/main.rs"

[dependencies]
# org.freedesktop.impl.portal.ScreenCast on the session bus. Pure-Rust DBus
# stack — no libdbus/zbus async runtime — matching shoestring-notify so the
# resolved dep set stays shared.
rustbus = "0.19"

# PipeWire client: we create the screencast stream and feed it frames. The
# -sys crates bind libpipewire-0.3 / libspa-0.2 via bindgen (build-deps:
# libclang + the pipewire dev headers).
pipewire = "0.10"
libspa = "0.10"

# Wayland client: we pull frames from the WM over zwlr_screencopy_v1. Versions
# match the sibling crates (shoestring-screenshot/bar) so the resolved deps stay
# shared.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# zwp_linux_dmabuf_v1: wrap a gbm buffer as a wl_buffer so screencopy can render
# straight into the dmabuf we also hand to PipeWire (zero-copy for fast consumers).
wayland-protocols = { version = "0.32", features = ["client"] }

# GPU buffer allocation for the dmabuf screencast path. Both crates are already
# in the resolved tree via smithay (the WM depends on them), so this adds no new
# external crates; libgbm dev headers come with the GPU stack the WM needs anyway.
gbm = "0.18"
drm-fourcc = "2"

# Shared config schema. We read the [portal] section of the WM's config.toml to
# learn the screencast output pin + how to choose one. Internal workspace crate;
# pulls only serde/toml, already in the resolved tree.
shoestring-config = { path = "../shoestring-config" }

# wl_shm capture buffer: mmap a tempfile, hand the fd to the WM, read pixels back.
memmap2 = "0.9"
tempfile = "3"

# PNG encoder for the Screenshot portal. Same crate/version shoestring-screenshot
# uses, so the resolved dep set stays shared.
png = "0.17"

# Lightweight error type for `main`.
anyhow = "1"

# `poll(2)` for the hand-rolled three-fd event loop (dbus + wayland +
# pipewire). Already in the transitive tree via rustbus, so adds no crates.
libc = "0.2"

# Structured logs (env-filterable). Match shoestring-wm so RUST_LOG and the
# SHOESTRING_*_LOG file redirect work the same way.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
