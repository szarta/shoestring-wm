[package]
name = "shoestring-region"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Interactive region picker for shoestring-wm. Slurp-equivalent: drag a rectangle, print 'OUTPUT X Y W H'."

[[bin]]
name = "shoestring-region"
path = "src/main.rs"

[dependencies]
# Same wayland stack the bar/menu/lock/screenshot use — already resolved.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# SHM pool: mmap an anon tempfile, hand the fd to the compositor.
memmap2 = "0.9"
tempfile = "3"
libc = "0.2"

# Keyboard: we only need Escape, but the keymap path mirrors the lock/menu.
xkbcommon = { version = "0.9", features = ["wayland"] }

# Crosshair cursor (same xcursor theme machinery the WM uses).
xcursor = "0.3"

anyhow = "1"
