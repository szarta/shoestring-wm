[package]
name = "shoestring-lock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Screen locker for shoestring-wm. Implements ext-session-lock-v1; verifies via PAM."

[[bin]]
name = "shoestring-lock"
path = "src/main.rs"

[dependencies]
# Same wayland stack the bar and screenshot use — already resolved in tree.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }

# Keyboard: parse the keymap the compositor hands us, translate keycodes.
xkbcommon = { version = "0.9", features = ["wayland"] }

# wl_shm pool: mmap an anon tempfile, give the fd to the compositor, draw.
memmap2 = "0.9"
tempfile = "3"

# Software-rasterized text for the prompt + status line.
fontdue = "0.9"

anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# poll(2) for the frame-paced event loop, and malloc/free for PAM
# conversation replies (src/pam.rs links libpam directly; no PAM crate).
# Already transitively in our tree via memmap2 / xkbcommon, so no new
# external crate.
libc = "0.2"
