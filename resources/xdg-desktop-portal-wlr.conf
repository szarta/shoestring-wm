# Example configuration for xdg-desktop-portal-wlr (xdpw), the screen-capture
# backend the shoestring-wm session routes ScreenCast/Screenshot to (see
# shoestring-wm-portals.conf).
#
# Install to one of (first match wins; see xdg-desktop-portal-wlr(5)):
#   ~/.config/xdg-desktop-portal-wlr/shoestring-wm   (this desktop only)
#   ~/.config/xdg-desktop-portal-wlr/config          (all desktops)
#   /etc/xdg/xdg-desktop-portal-wlr/config           (system-wide)
#
# All keys live under [screencast]. This file is OPTIONAL: with no config xdpw
# prompts for an output via its built-in chooser. Tune below to taste.

[screencast]
# Cap the capture frame rate. The compositor re-renders an offscreen copy per
# screencopy frame, so a limit keeps a video call from pinning the GPU at the
# monitor's full refresh.
max_fps=30

# How to pick which output gets shared:
#   chooser_type=simple   built-in picker (default if unset)
#   chooser_type=none     no prompt; capture the output named below
#   chooser_type=dmenu    pipe output names to chooser_cmd, read selection
#   chooser_type=default  let xdpw decide (first output)
#
# For a single-monitor or headless/scripted setup, pin one output and skip the
# prompt:
#chooser_type=none
#output_name=eDP-1          # see `shoestring-ctl outputs` or wayland-info

# Run a command around a capture session — e.g. pause the notification daemon
# so popups don't leak into a shared screen:
#exec_before=pkill -STOP shoestring-notify
#exec_after=pkill -CONT shoestring-notify
