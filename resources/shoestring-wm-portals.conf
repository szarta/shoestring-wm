# xdg-desktop-portal backend selection for the shoestring-wm session.
#
# xdg-desktop-portal (the frontend) picks an *implementation* backend per
# portal interface by matching $XDG_CURRENT_DESKTOP. Our session sets
# XDG_CURRENT_DESKTOP=shoestring-wm (see resources/shoestring-wm-session),
# which appears in no backend's `UseIn=` line — so without this file the
# frontend has no backend for ScreenCast/Screenshot and screen sharing
# silently fails. The frontend loads `<desktop>-portals.conf`, hence the
# name; install it as shoestring-wm-portals.conf.
#
# Backend names below are the basenames of the *.portal files in
# /usr/share/xdg-desktop-portal/portals/ (wlr, gtk, gnome, shoestring, ...).
#
# ScreenCast + Screenshot -> our own backend (xdg-desktop-portal-shoestring,
# shipped as shoestring.portal). For ScreenCast it feeds PipeWire both dmabuf
# and shm and lets each consumer pick, so fast consumers (browsers/OBS) get
# dmabuf while pickier ones (Zoom, whose Mesa can't import our dmabuf) get shm —
# which xdpw could never do. Screenshot captures over the same wlr-screencopy
# protocol. With both served here the session no longer needs xdpw. Everything
# else (file chooser, settings, account, ...) goes to the GTK backend.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=shoestring
org.freedesktop.impl.portal.Screenshot=shoestring
